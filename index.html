<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    
    <!-- Primary SEO Metadata -->
    <title>Valley Reigns | High-Fidelity Tech Recruitment & Communication Routing</title>
    <meta name="description" content="Valley Reigns is a premier high-fidelity recruitment routing platform bridging exceptional tech talent with top-tier companies through interactive, real-time communication channels." />
    <meta name="keywords" content="Valley Reigns, tech recruitment, developer jobs, recruitment routing, real-time communication routing, hire engineers, elite tech talent, interactive hiring platform" />
    <meta name="author" content="Valley Reigns" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://valley-reigns.onrender.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://valley-reigns.onrender.com" />
    <meta property="og:title" content="Valley Reigns | High-Fidelity Tech Recruitment & Communication Routing" />
    <meta property="og:description" content="Connect elite tech talent with top-tier companies. Valley Reigns uses real-time communication routing for seamless, high-fidelity hiring." />
    <meta property="og:image" content="https://valley-reigns.onrender.com/social_image.jpg" />
    <meta property="og:site_name" content="Valley Reigns" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://valley-reigns.onrender.com" />
    <meta property="twitter:title" content="Valley Reigns | High-Fidelity Tech Recruitment & Communication Routing" />
    <meta property="twitter:description" content="Connect elite tech talent with top-tier companies. Valley Reigns uses real-time communication routing for seamless, high-fidelity hiring." />
    <meta property="twitter:image" content="https://valley-reigns.onrender.com/social_image.jpg" />

    <!-- PWA & Mobile Optimization -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Fonts preconnect for faster rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data: Organization & WebSite Schemas for Rich Search Snippets -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Valley Reigns",
        "url": "https://valley-reigns.onrender.com",
        "logo": "https://valley-reigns.onrender.com/icon.svg",
        "sameAs": [
          "https://twitter.com/valleyreigns",
          "https://www.linkedin.com/company/valleyreigns"
        ],
        "description": "A high-fidelity recruitment routing platform designed to bridge tech talent with top companies via interactive, real-time communication routing."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Valley Reigns",
        "url": "https://valley-reigns.onrender.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://valley-reigns.onrender.com/?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script>
      (function() {
        try {
          document.documentElement.classList.remove('dark');
          localStorage.removeItem('theme');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-installable'));
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('ServiceWorker registered:', reg);
              window.dispatchEvent(new CustomEvent('sw-registered'));
            })
            .catch(err => console.error('ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
