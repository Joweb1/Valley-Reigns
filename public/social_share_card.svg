<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d10" />
      <stop offset="50%" stop-color="#0e1714" />
      <stop offset="100%" stop-color="#06120e" />
    </linearGradient>
    
    <!-- Gold Gradient for Crown & Accents -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a85c" />
      <stop offset="50%" stop-color="#e9d391" />
      <stop offset="100%" stop-color="#fdf1c7" />
    </linearGradient>

    <!-- Emerald Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5132" />
      <stop offset="100%" stop-color="#198754" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0dcaf0" />
      <stop offset="100%" stop-color="#0d6efd" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Shadow Filter for Text -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" />
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Glowing Abstract Tech Valley Curves -->
  <g opacity="0.25">
    <path d="M-100,500 Q200,350 500,480 T1100,400 T1300,550 L1300,680 L-100,680 Z" fill="url(#tealGrad)" />
    <path d="M-50,550 Q300,420 700,520 T1200,460 T1350,580 L1350,680 L-50,680 Z" fill="url(#tealGrad)" opacity="0.6" />
    <path d="M-150,580 Q250,480 600,570 T1150,520 T1300,620 L1300,680 L-150,680 Z" fill="#0f5132" opacity="0.4" />
  </g>

  <!-- Network / Routing Lines -->
  <g stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.35" fill="none">
    <line x1="100" y1="150" x2="300" y2="250" />
    <line x1="300" y1="250" x2="500" y2="180" />
    <line x1="300" y1="250" x2="250" y2="400" />
    <line x1="500" y1="180" x2="700" y2="280" />
    <line x1="700" y1="280" x2="950" y2="150" />
    <line x1="700" y1="280" x2="750" y2="420" />
    <line x1="950" y1="150" x2="1100" y2="300" />
    <!-- Pulsing connections -->
    <line x1="250" y1="400" x2="450" y2="480" stroke-dasharray="5,5" />
    <line x1="750" y1="420" x2="600" y2="490" stroke-dasharray="5,5" />
  </g>

  <!-- Glowing Connection Nodes -->
  <g>
    <!-- Node 1 -->
    <circle cx="100" cy="150" r="4" fill="#0dcaf0" filter="url(#glow)" />
    <!-- Node 2 -->
    <circle cx="300" cy="250" r="6" fill="#0d6efd" filter="url(#glow)" />
    <circle cx="300" cy="250" r="2" fill="#ffffff" />
    <!-- Node 3 -->
    <circle cx="500" cy="180" r="5" fill="#0dcaf0" filter="url(#glow)" />
    <!-- Node 4 -->
    <circle cx="250" cy="400" r="7" fill="#198754" filter="url(#glow)" />
    <circle cx="250" cy="400" r="3" fill="#ffffff" />
    <!-- Node 5 -->
    <circle cx="700" cy="280" r="8" fill="#e9d391" filter="url(#glow)" />
    <circle cx="700" cy="280" r="3" fill="#ffffff" />
    <!-- Node 6 -->
    <circle cx="950" cy="150" r="5" fill="#0dcaf0" filter="url(#glow)" />
    <!-- Node 7 -->
    <circle cx="750" cy="420" r="6" fill="#198754" filter="url(#glow)" />
    <!-- Node 8 -->
    <circle cx="1100" cy="300" r="4" fill="#0d6efd" filter="url(#glow)" />
  </g>

  <!-- Real-time communication data burst indicators -->
  <g fill="#e9d391" opacity="0.8">
    <circle cx="200" cy="200" r="2" />
    <circle cx="400" cy="215" r="2.5" />
    <circle cx="600" cy="230" r="3" filter="url(#glow)" />
    <circle cx="825" cy="215" r="2" />
    <circle cx="1025" cy="225" r="2.5" />
  </g>

  <!-- Branding Group: Crown Icon & Text -->
  <g transform="translate(600, 240)" text-anchor="middle">
    <!-- Minimalist Golden Crown Crest -->
    <path d="M-40,-45 L-25,-15 L0,-35 L25,-15 L40,-45 L20,-5 L-20,-5 Z M-25,0 L25,0 L18,8 L-18,8 Z" 
          fill="url(#goldGrad)" 
          filter="url(#glow)" />
          
    <!-- Main Typography -->
    <text y="75" 
          fill="url(#goldGrad)" 
          font-family="'Inter', system-ui, sans-serif" 
          font-weight="900" 
          font-size="64" 
          letter-spacing="14" 
          filter="url(#shadow)">VALLEY REIGNS</text>
          
    <!-- Subtitle -->
    <text y="125" 
          fill="#a0aec0" 
          font-family="'Inter', system-ui, sans-serif" 
          font-weight="500" 
          font-size="18" 
          letter-spacing="5">HIGH-FIDELITY RECRUITMENT ROUTING</text>

    <!-- Technical Status Badge (Real-time Signal) -->
    <g transform="translate(0, 165)">
      <rect x="-140" y="-18" width="280" height="32" rx="16" fill="#0f1715" stroke="#1c3d2f" stroke-width="1.5" />
      <circle cx="-110" cy="-2" r="4.5" fill="#198754" filter="url(#glow)" />
      <text x="-95" y="3" 
            fill="#34d399" 
            font-family="monospace" 
            font-size="11" 
            letter-spacing="1.5" 
            text-anchor="start">REAL-TIME ROUTING • ONLINE</text>
    </g>
  </g>

  <!-- Decorative corner tech lines -->
  <path d="M 30 50 L 30 30 L 50 30" stroke="#1c3d2f" stroke-width="3" fill="none" />
  <path d="M 1170 50 L 1170 30 L 1150 30" stroke="#1c3d2f" stroke-width="3" fill="none" />
  <path d="M 30 580 L 30 600 L 50 600" stroke="#1c3d2f" stroke-width="3" fill="none" />
  <path d="M 1170 580 L 1170 600 L 1150 600" stroke="#1c3d2f" stroke-width="3" fill="none" />
</svg>
