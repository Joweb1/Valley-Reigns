<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background with no border radius -->
  <rect width="512" height="512" fill="#FFFFFF"/>
  
  <!-- Stylized Brand Icon Shapes -->
  <!-- Blue Circle (left) -->
  <circle cx="160" cy="285" r="60" fill="#0084FF" />
  
  <!-- Black Triangle (bottom-center) -->
  <polygon points="256,305 316,365 196,365" fill="#111111" />
  
  <!-- Black Tilted Capsule (right-top) -->
  <rect x="180" y="180" width="240" height="80" rx="40" transform="rotate(40, 300, 220)" fill="#111111" />
</svg>
