<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valley Reigns | Connection Offline</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --navy-border: #0B1B3D;
      --navy-primary: #0B1B3D;
      --navy-hover: #162A52;
      --text-main: #0B1B3D;
      --text-muted: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
    }

    /* Background pattern */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 10% 10%, rgba(11, 27, 61, 0.03) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(11, 27, 61, 0.04) 0%, transparent 40%);
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border: 1px solid var(--navy-border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: none;
      animation: fadeIn 0.4s ease-out;
      margin: auto;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      margin-bottom: 2rem;
    }

    .logo-img {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .logo-text {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--navy-primary);
    }

    .icon-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 1.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(11, 27, 61, 0.04);
      border: 1px solid rgba(11, 27, 61, 0.12);
      animation: pulse 2.4s infinite ease-in-out;
    }

    .icon-pulse-delayed {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(11, 27, 61, 0.02);
      border: 1px solid rgba(11, 27, 61, 0.06);
      animation: pulse 2.4s infinite ease-in-out 1.2s;
    }

    .offline-svg {
      position: relative;
      z-index: 3;
      width: 40px;
      height: 40px;
      color: var(--navy-primary);
    }

    .network-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(225, 29, 72, 0.08);
      border: 1px solid rgba(225, 29, 72, 0.2);
      color: #be123c;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.725rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: #e11d48;
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      color: var(--text-main);
    }

    p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.85rem 1.5rem;
      background: var(--navy-primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.925rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.15s ease;
      box-shadow: none;
    }

    .retry-btn:hover {
      background: var(--navy-hover);
      transform: translateY(-1px);
      box-shadow: none;
    }

    .retry-btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.85);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: scale(1.25);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Valley Reigns Brand Logo -->
    <div class="logo-container">
      <img 
        src="/icon.svg" 
        alt="Valley Reigns Logo" 
        class="logo-img"
        width="34"
        height="34"
        onerror="this.style.display='none'; document.getElementById('fallback-logo-svg').style.display='inline-block';"
      />
      <svg id="fallback-logo-svg" style="display:none;" width="34" height="34" viewBox="0 0 512 512">
        <rect width="512" height="512" fill="#FFFFFF"/>
        <circle cx="160" cy="285" r="60" fill="#0084FF" />
        <polygon points="256,305 316,365 196,365" fill="#111111" />
        <rect x="180" y="180" width="240" height="80" rx="40" transform="rotate(40, 300, 220)" fill="#111111" />
      </svg>
      <span class="logo-text">Valley Reigns</span>
    </div>

    <!-- Animated Offline Indicator -->
    <div class="icon-wrapper">
      <div class="icon-pulse"></div>
      <div class="icon-pulse-delayed"></div>
      <!-- Wifi Off SVG icon -->
      <svg class="offline-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.5M5 12.5a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M12 20h.01"/>
      </svg>
    </div>

    <!-- Status badge -->
    <div class="network-badge">
      <span class="badge-dot"></span>
      Offline Mode Active
    </div>

    <h1>You are currently offline</h1>
    <p>
      Valley Reigns' recruitment routing and high-fidelity messaging servers cannot be reached. Check your internet connection and try reloading.
    </p>

    <button class="retry-btn" onclick="retryConnection()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Retry Connection
    </button>
  </div>

  <script>
    function retryConnection() {
      const btn = document.querySelector('.retry-btn');
      btn.innerHTML = 'Connecting...';
      btn.style.opacity = '0.7';
      btn.style.pointerEvents = 'none';
      
      setTimeout(() => {
        window.location.reload();
      }, 500);
    }

    // Auto retry when network status goes back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
