<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valley Reigns | Connection Offline</title>
  <style>
    :root {
      --bg-color: #f4f7f6; /* Modern off-white minty background */
      --card-bg: rgba(255, 255, 255, 0.55); /* High-fidelity glossy backdrop */
      --border-color: rgba(255, 255, 255, 0.7); /* Sleek glass highlights */
      --card-shadow: 0 24px 48px -12px rgba(15, 81, 50, 0.12), 0 0 32px rgba(16, 185, 129, 0.04);
      --primary-color: #0F5132; /* Valley Reigns Signature Dark Emerald */
      --primary-hover: #146c43;
      --text-main: #0B3C2D; /* Refined primary text */
      --text-muted: #475569; /* Slate-600 description */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
    }

    /* Soft organic light theme decorative glowing gradients */
    body::before {
      content: '';
      position: absolute;
      top: -10%;
      left: -10%;
      right: -10%;
      bottom: -10%;
      background: 
        radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.1) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(240, 253, 244, 0.6) 0%, transparent 100%);
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 3.5rem 2.5rem;
      text-align: center;
      backdrop-filter: blur(24px) saturate(120%);
      -webkit-backdrop-filter: blur(24px) saturate(120%);
      box-shadow: var(--card-shadow);
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2.25rem;
    }

    .logo-text {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--primary-color);
      margin-left: 0.6rem;
    }

    .icon-wrapper {
      position: relative;
      width: 112px;
      height: 112px;
      margin: 0 auto 2.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(15, 81, 50, 0.05);
      border: 1px solid rgba(15, 81, 50, 0.12);
      animation: pulse 2.4s infinite ease-in-out;
    }

    .icon-pulse-delayed {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(15, 81, 50, 0.02);
      border: 1px solid rgba(15, 81, 50, 0.06);
      animation: pulse 2.4s infinite ease-in-out 1.2s;
    }

    .offline-svg {
      position: relative;
      z-index: 3;
      width: 44px;
      height: 44px;
      color: var(--primary-color);
      filter: drop-shadow(0 4px 12px rgba(15, 81, 50, 0.15));
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.85rem;
      color: var(--text-main);
    }

    p {
      color: var(--text-muted);
      font-size: 0.925rem;
      line-height: 1.6;
      margin-bottom: 2.25rem;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 20px rgba(15, 81, 50, 0.15);
    }

    .retry-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(15, 81, 50, 0.22);
    }

    .retry-btn:active {
      transform: translateY(0);
      box-shadow: 0 4px 10px rgba(15, 81, 50, 0.15);
    }

    .network-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.15);
      color: #dc2626;
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.725rem;
      font-weight: 700;
      margin-bottom: 1.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: #ef4444;
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: scale(1.3);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Brand logo/name -->
    <div class="logo-container">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F5132" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
      <span class="logo-text">Valley Reigns</span>
    </div>

    <!-- Animated Offline Indicator -->
    <div class="icon-wrapper">
      <div class="icon-pulse"></div>
      <div class="icon-pulse-delayed"></div>
      <!-- Wifi Off SVG icon -->
      <svg class="offline-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.5M5 12.5a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M12 20h.01"/>
      </svg>
    </div>

    <!-- Status badge -->
    <div class="network-badge">
      <span class="badge-dot"></span>
      Offline Mode Active
    </div>

    <h1>You are currently offline</h1>
    <p>
      Valley Reigns' recruitment routing and high-fidelity messaging servers cannot be reached. Check your internet connection and try reloading.
    </p>

    <button class="retry-btn" onclick="retryConnection()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Retry Connection
    </button>
  </div>

  <script>
    function retryConnection() {
      // Show dynamic reloading state
      const btn = document.querySelector('.retry-btn');
      btn.innerHTML = 'Connecting...';
      btn.style.opacity = '0.7';
      btn.style.pointerEvents = 'none';
      
      setTimeout(() => {
        window.location.reload();
      }, 500);
    }

    // Auto retry when network status goes back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
